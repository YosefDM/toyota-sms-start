name: Claude Code Review

# Automated review on every pull request, using the same /code-review skill you run locally.
# Project rules in CLAUDE.md (incl. the UI-only hard rule) are in Claude's context during review.
#
# Auth: a Claude subscription OAuth token in the CLAUDE_CODE_OAUTH_TOKEN secret
#   (generate with `claude setup-token`). The Claude GitHub App must be installed on the repo
#   so the action can post comments — see docs/CICD.md.
# Note: on public repos, GitHub withholds secrets from fork PRs, so this runs only on PRs from
#   branches in this repo (fine for a solo repo).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
