name: CI

# Runs on EVERY branch push, not just master, plus every PR. A branch used to get no CI at all
# until a PR existed for it -- and because GitHub cannot build a merge ref for a conflicting PR, a
# PR that went stale reported no checks whatsoever rather than a failure, which reads as "green".
# Testing the branch tip independently of the PR removes that silent gap.
#
# Note the two are NOT redundant: the push run tests the branch tip, the pull_request run tests the
# branch MERGED into the base, which is what actually ships.
on:
  push:
  pull_request:

# One in-flight run per ref: pushing three times in a minute should not queue three full runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile the server modules
        run: python -m py_compile server/app.py server/toyota_control.py server/voice.py server/textgrid_auth.py
      - name: Unit tests (offline — no device needed)
        run: python -m unittest discover -s server/tests -v
